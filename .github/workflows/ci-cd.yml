name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"      # les commits du scraper ne relancent pas tout le pipeline
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule les exécutions obsolètes d'une même branche
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # matplotlib sans écran
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: techsight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (le conteneur répond-il ?)
        run: |
          docker run -d --name techsight -p 8501:8501 techsight:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo " -> App OK"
              exit 0
            fi
            sleep 2
          done
          echo "L'application n'a pas démarré :"
          docker logs techsight
          exit 1

  # ---------------------------------------------------------------- CD
  publish:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5   # met le nom en minuscules automatiquement
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    # Actif seulement si vous créez la variable de dépôt ENABLE_DEPLOY=true
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            IMAGE=ghcr.io/mouad-melloul/techsight:latest
            docker pull $IMAGE
            docker stop techsight || true
            docker rm techsight || true
            docker run -d --name techsight --restart unless-stopped \
              -p 8501:8501 -v /srv/techsight/data:/app/data $IMAGE