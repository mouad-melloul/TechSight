name: LinkedIn Scraper

on:
  schedule:
    - cron: "0 8 * * *"   # tous les jours à 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run scraper
        run: python scraping/auto_scraper_linkedin.py
      - name: Validate dataset
        run: pytest tests/test_data.py -q
      - name: Commit and push dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dataset_final.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "chore(data): update dataset_final.csv [automated]"
          git pull --rebase origin main
          git push